# The gateway as the deploy ships it (the repository's Dockerfile), for the end-to-end test: e2e/run.py --docker
# writes the config into $E2E_RUN_DIR and drives everything. Ports on 127.0.0.1 only.
name: gw-e2e
services:
  anthropic:   # the stand-in, used unless E2E_UPSTREAM points at a real gateway
    image: python:3.12-slim
    command: ["python", "/e2e/fake_anthropic.py", "9000"]
    volumes: ["./:/e2e:ro"]
    ports: ["127.0.0.1:18490:9000"]
  gateway:
    build: ..
    image: claude-proxy:e2e
    depends_on: [anthropic]
    environment:
      CLAUDE_PROXY_CONFIG: /e2e-run/config.toml
      CLAUDE_PROXY_CREDENTIAL_KEY: ${E2E_CREDENTIAL_KEY:?}
      CLAUDE_PROXY_UPSTREAM: ${E2E_UPSTREAM:-http://anthropic:9000}
      E2E_UPSTREAM_TOKEN: ${E2E_UPSTREAM_TOKEN:-}
    volumes:
      - ./:/e2e:ro
      - ${E2E_RUN_DIR:?}:/e2e-run:ro
      - data:/data
    ports: ["127.0.0.1:18480:8080", "127.0.0.1:18481:8081"]
volumes:
  data:
