# claude-proxy configuration. Every key is optional; values shown are the defaults.
# Point the gateway at it with --config or CLAUDE_PROXY_CONFIG.

retention_days = 180        # requests and quota snapshots older than this are deleted

[listener]
host = "127.0.0.1"          # proxy: what users put in ANTHROPIC_BASE_URL
port = 8080
dashboard_host = "127.0.0.1"
dashboard_port = 8081
secure_cookies = false      # true when the dashboard is served over HTTPS (e.g. behind Caddy)

[upstream]
base_url = "https://api.anthropic.com"

[credential]
# Claude Code 2.1.280 OAuth values (read from its binary). They have changed before; override here if they do.
client_id = "9d1c250a-e61b-44d9-88ed-5944d1962f5e"
authorize_url = "https://claude.com/cai/oauth/authorize"
token_url = "https://platform.claude.com/v1/oauth/token"
redirect_uri = "https://platform.claude.com/oauth/code/callback"
scopes = "org:create_api_key user:profile user:inference user:sessions:claude_code user:mcp_servers user:file_upload user:plugins"
refresh_scopes = "user:profile user:inference user:sessions:claude_code user:mcp_servers user:file_upload user:plugins"
beta_flag = "oauth-2025-04-20"
usage_url = "https://api.anthropic.com/api/oauth/usage"
user_agent = "claude-code/2.1.280"

[quota]
poll_idle_s = 600           # poll the usage endpoint only when no response headers arrived for this long
poll_min_interval_s = 180
poll_max_backoff_s = 1800
stale_after_s = 1800        # share limits are skipped when account figures are older than this

[limits]
max_inflight = 8            # requests one user may have in flight at once; limits can be overshot by at most this many

[db]
path = "claude_proxy.db"

# Third-party models that speak the Anthropic Messages format. The Claude credential is never sent here.
[[routes]]
name = "meta"
base_url = "https://api.meta.ai"
api_key_env = "META_API_KEY"
models = ["muse-spark*"]
model_map = { "muse-spark" = "muse-spark-1.3" }
strip_headers = ["anthropic-beta"]
drop_body_fields = []     # e.g. ["context_management"] if Meta rejects an Anthropic-only field
# Sizes /v1/models reports for each listed model (OpenCode uses them); give context and output together.
# Routes match by glob, so /v1/models lists only the model_map and model_info keys.
model_info = { "muse-spark" = { context = 1048576, output = 32000, display_name = "Muse Spark 1.3" } }

# Prices in USD per million tokens, first match wins; these are prepended to the built-in table.
# [pricing]
# reference_model = "claude-sonnet-5"
# [pricing.models."my-model*"]
# input = 1.0
# output = 5.0

# Paid tickets (docs/superpowers/specs/2026-10-03-paid-tickets-design.md). Present = enabled: the dashboard gains
# Tickets and Pricing tabs and the home page at / shows the public prices. Shares live here because changing one changes capacity; prices
# are seeded from default_usd on first start and edited in the dashboard afterwards.
# [tickets]
# how_to_buy = "Send the amount by bank transfer to … and email the admin."
# max_sold_pct = 80            # tickets and bonuses together may reserve at most this; the rest is headroom
# [tickets.tiers.lite]
# label = "Lite"
# share_pct = 5
# compare = "Claude Pro"
# default_usd = { day = 3, week = 8, month = 20 }
# [tickets.tiers.standard]
# label = "Standard"
# share_pct = 25
# compare = "Claude Max 5x"
# default_usd = { day = 12, week = 35, month = 100 }
# [tickets.currencies.EUR]     # USD is built in; add a daily rate on the Pricing tab for each currency here
# round_to = 0.50
#
# Order requests (docs/superpowers/specs/2026-10-04-order-requests-design.md): signed-in users order from their price
# list. With a Turnstile site key (and TURNSTILE_SECRET in the environment) visitors can also order from the home page;
# without the secret it logs a warning and "Get it" keeps linking to the dashboard. Put turnstile_site_key in [tickets]:
# turnstile_site_key = "0x..."   # public; the secret is TURNSTILE_SECRET in the environment
#
# Email for new orders (optional; without it orders are stored and shown on the Orders tab, no mail is sent):
# [email]
# smtp_host = "smtp.example.com"                 # required
# smtp_port = 587                                # default 587 with STARTTLS; 465 means implicit TLS
# smtp_user = "gateway@example.com"              # optional; without it no AUTH is attempted
# from = "Claude Gateway <gateway@example.com>"  # required
# admin_to = "admin@example.com"                 # required
# # password: SMTP_PASSWORD in the environment (required when smtp_user is set)
