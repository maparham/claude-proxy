[listener]
host = "127.0.0.1"
port = 8080
dashboard_port = 8081

[upstream]
base_url = "https://api.anthropic.com"

[credential]
# OAuth-only (Pro/Max subscription) — api_key removed
client_id = "9d1c250a-e61b-44d9-88ed-5944d1962f5e"
authorize_url = "https://claude.ai/oauth/authorize"
token_url = "https://platform.claude.com/v1/oauth/token"
scopes = "user:inference user:profile user:sessions:claude_code user:mcp_servers user:file_upload"
beta_flag = "oauth-2025-04-20"
usage_url = "https://api.anthropic.com/api/oauth/usage"
redirect_uri = "https://platform.claude.com/oauth/code/callback"

[db]
path = "claude_proxy.db"

retention_days = 180

# Encryption for stored OAuth tokens:
# set CLAUDE_PROXY_CREDENTIAL_KEY (base64 urlsafe 32B) or CLAUDE_PROXY_CREDENTIAL_KEY_FILE (0600)
