[project]
name = "claude-proxy"
version = "0.1.0"
description = "Shared-subscription gateway with per-user metering, limits and dashboard"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "argon2-cffi>=23",
    "cryptography>=42",
    "pydantic>=2",
]

[project.scripts]
claude-proxy = "claude_proxy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_proxy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "anyio>=4",
]
