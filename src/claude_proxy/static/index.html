<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>کلاد</title>
<link rel="stylesheet" href="/static/app.css">
<meta name="clerk-fa-ir" content="/static/clerk-fa-IR.js">
<script src="/static/i18n.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js" integrity="sha384-pPi0zxBAoDu6+JXW/C68UZLvBUUtU+7zonhif43rqj7pxsGyqyqzcian2Rj37Rss" crossorigin="anonymous" defer></script>
<script src="/static/app.js" defer></script>
</head>
<body>
<div id="login" class="signin hidden">
  <p class="signin-brand" data-i18n="app.title">کلاد</p>
  <section class="signin-intro">
    <div id="authorize-hint" class="hidden">
      <h1 data-i18n="login.auth_title">Sign in to connect your computer.</h1>
      <p class="signin-lede" data-i18n="login.auth_lede">The link you opened carries this code. After you sign in, you check that your terminal shows the same one, then approve it.</p>
      <p class="signin-code" id="authorize-code"></p>
    </div>
  </section>
  <p class="signin-foot"><a href="/privacy" data-i18n="login.privacy">Privacy</a><span class="pricing-link hidden"> · <a href="/#pricing" data-i18n="login.pricing">Pricing</a></span> · <button type="button" class="linklike" id="lang-signin" data-i18n="app.lang_other">فارسی</button></p>
  <section class="signin-panel">
    <div class="signin-box">
      <h2 data-i18n="login.title">Sign in</h2>
      <div id="clerk-area" class="hidden"><div id="clerk-signin"></div>
        <button type="button" class="signin-more" id="other-ways" aria-expanded="false" aria-controls="classic" data-i18n="login.other_ways">Other ways to sign in</button></div>
      <div id="classic" class="hidden">
      <p class="signin-sub" id="login-hint"><span data-i18n="login.key_hint">Sign in with your own gateway key to see your usage.</span><span class="tip-i" tabindex="0" role="button" aria-label="About gateway keys" data-i18n-attr="aria-label:login.about_keys" data-tip="login_key">?</span></p>
      <form id="form-admin" class="hidden">
        <input type="text" name="username" placeholder="Admin username" aria-label="Admin username" data-i18n-attr="placeholder:login.admin_user;aria-label:login.admin_user" dir="ltr" autocomplete="username" value="admin" required>
        <input type="password" name="password" placeholder="Password" aria-label="Password" data-i18n-attr="placeholder:login.password;aria-label:login.password" dir="ltr" autocomplete="current-password" required>
        <button class="btn primary" type="submit" data-i18n="login.submit">Sign in</button>
      </form>
      <form id="form-key">
        <input type="password" name="key" placeholder="sk-proxy-…" aria-label="Gateway key" data-i18n-attr="aria-label:login.key_label" dir="ltr" autocomplete="off" required>
        <button class="btn primary" type="submit" data-i18n="login.submit_key">Sign in with key</button>
      </form>
      </div>
      <div class="error" id="login-error" role="alert"></div>
    </div>
  </section>
</div>

<div id="app" class="hidden">
  <header class="top">
    <h1 data-i18n="app.title">کلاد</h1>
    <span class="pill" id="cred-pill" tabindex="0"><span class="dot"></span><span data-i18n="app.credential">credential</span></span>
    <span class="spacer"></span>
    <button class="pill" id="who" title="Change your name" data-i18n-attr="title:app.who_title"></button>
    <a class="btn small pricing-link hidden" id="pricing-btn" href="/?home#pricing" title="The price list for passes" data-i18n="app.pricing" data-i18n-attr="title:app.pricing_title">Pricing</a>
    <button class="btn small" id="theme-toggle" title="Switch theme" data-i18n="app.theme" data-i18n-attr="title:app.theme_title">Theme</button>
    <button class="btn small" id="lang-toggle" data-i18n="app.lang_other" data-i18n-attr="title:app.lang_title">فارسی</button>
    <button class="btn small" id="logout" data-i18n="app.signout">Sign out</button>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main id="main"></main>
</div>

<dialog id="dialog"></dialog>
<div id="tip" role="tooltip" popover="manual"></div>
</body>
</html>
