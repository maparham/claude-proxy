<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Gateway</title>
<link rel="stylesheet" href="/static/app.css">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js" defer></script>
<script src="/static/app.js" defer></script>
</head>
<body>
<div id="login" class="login hidden">
  <div class="card">
    <h2>Claude Gateway</h2>
    <p class="muted" id="login-hint">Sign in as the admin, or with your own gateway key to see your usage.<span class="tip-i" tabindex="0" role="button" aria-label="About gateway keys" data-tip="login_key">?</span></p>
    <form id="form-admin">
      <input type="text" name="username" placeholder="Admin username" autocomplete="username" value="admin" required>
      <input type="password" name="password" placeholder="Password" autocomplete="current-password" required>
      <button class="btn primary" type="submit">Sign in</button>
    </form>
    <form id="form-key" class="hidden">
      <input type="password" name="key" placeholder="sk-proxy-…" autocomplete="off" required>
      <button class="btn primary" type="submit">Sign in with key</button>
    </form>
    <div class="error" id="login-error" role="alert"></div>
    <div class="switch"><a href="#" id="login-switch">Use my gateway key instead</a></div>
  </div>
</div>

<div id="app" class="hidden">
  <header class="top">
    <h1>Claude Gateway</h1>
    <span class="pill" id="cred-pill" tabindex="0"><span class="dot"></span><span>credential</span></span>
    <span class="spacer"></span>
    <span class="pill" id="who"></span>
    <button class="btn small" id="theme-toggle" title="Switch theme">Theme</button>
    <button class="btn small" id="logout">Sign out</button>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main id="main"></main>
</div>

<dialog id="dialog"></dialog>
<div id="tip" role="tooltip" popover="manual"></div>
</body>
</html>
