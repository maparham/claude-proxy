<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="description" content="Use Claude Code on a shared Claude subscription, by the day, week or month.">
<title>کلاد</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/home.css">
<script src="/static/i18n.js"></script>
<script src="/static/home.js" defer></script>
</head>
<body class="home">
<header class="home-top">
  <span class="home-brand" data-i18n="app.title">کلاد</span>
  <span class="home-top-right">
    <button type="button" class="btn small" id="lang-toggle" data-i18n="app.lang_other" data-i18n-attr="title:app.lang_title">فارسی</button>
    <a class="btn small" href="/dashboard" data-i18n="login.submit">Sign in</a>
  </span>
</header>
<main>
  <section class="hero">
    <h1 data-i18n="login.about_title">Your Claude Code access, in one place.</h1>
    <p class="hero-lede" data-i18n="home.hero_lede">Take a share of the subscription for a day, a week or a month. You sign in, connect your computer with one command, and run <code>gclaude</code>.</p>
    <p class="hero-cta"><a class="btn primary" href="#pricing" data-i18n="home.see_pricing">See pricing</a> <a class="btn" href="/dashboard" data-i18n="login.submit">Sign in</a></p>
  </section>


  <section id="pricing" class="pricing-sec" aria-labelledby="pricing-h">
    <h2 id="pricing-h" data-i18n="tab.pricing">Pricing</h2>
    <div class="pill-toggle" id="length-toggle" role="group" aria-label="Ticket length" data-i18n-attr="aria-label:home.length_label">
      <button type="button" data-length="day" aria-pressed="false" data-i18n="home.len_day">Day</button><button type="button" data-length="week" aria-pressed="true" data-i18n="home.len_week">Week</button><button type="button" data-length="month" aria-pressed="false" data-i18n="home.len_month">Month</button>
    </div>
    <div class="cards" id="cards"><p class="muted" data-i18n="app.loading">Loading…</p></div>
    <p class="muted rate-note" id="rate-note"></p>
  </section>

</main>
<dialog id="order-dialog" class="order-dialog" aria-labelledby="order-h"></dialog>
<footer class="home-foot">
  <p><a href="/dashboard" data-i18n="login.submit">Sign in</a> · <a href="/privacy" data-i18n="login.privacy">Privacy</a></p>
  <p class="foot-currency"><label for="currency-select" data-i18n="home.currency_label">Currency</label> <select id="currency-select"></select></p>
</footer>
</body>
</html>
