# Hourly check from outside: the gateway answers through Cloudflare and its subscription login works.
# A failed run makes GitHub email whoever last changed this schedule. One recheck after 2 minutes keeps
# a deploy's few-second restart from raising an alarm. Hourly keeps it near 720 of the free plan's
# 2,000 Actions minutes a month.
name: gateway monitor

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gateway up and logged in
        shell: bash
        run: |
          check() {
            body=$(curl -fsS --max-time 15 https://claude.rahkar.pro/health) || { echo "unreachable"; return 1; }
            echo "$body"
            jq -e '.ok == true and .credential == true' <<<"$body" >/dev/null
          }
          check && exit 0
          echo "::warning::first check failed; rechecking in 2 minutes"
          sleep 120
          check || { echo "::error::gateway is down or its subscription login is broken"; exit 1; }
