# Tests on every push and pull request. A green push to master deploys to the Lightsail box: the image is
# built here (in the background while the tests run, so it is ready when they pass), streamed over SSH and swapped in by deploy/lightsail/claude-gateway-deploy, which rolls back
# on a failed health check. "Run workflow" redeploys master. Setup: deploy/lightsail/install-deploy-key.sh.
name: test and deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # the test job looks up the last green deploy

# One run per branch at a time, in push order (a newer queued run replaces an older queued one), so an
# older commit can't deploy over a newer one and deploys never overlap.
defaults:
  run:
    shell: bash   # adds pipefail, so a failed docker save fails the step

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEPLOY: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # tags, for the client's version (git describe), and the diff against the last green deploy
      # Builds and packages the image beside the tests; "Wait for image" picks up the result.
      - name: Start image build
        if: env.DEPLOY == 'true'
        run: |
          mkdir payload
          cp deploy/lightsail/config.toml payload/
          version=$(git describe --tags --match 'v[0-9]*')
          nohup bash -o pipefail -c '
            docker build --build-arg "CLIENT_VERSION=$1" -t "claude-proxy:$GITHUB_SHA" . &&
            docker save "claude-proxy:$GITHUB_SHA" | gzip >payload/image.tar.gz
            echo $? >build.status' _ "$version" >build.log 2>&1 &
      - uses: astral-sh/setup-uv@v7
      # A push to master that changes only src/claude_proxy/static/ since the last green deploy (not since the
      # previous push: a queued run a newer one replaced never ran its tests) runs just the tests that cover the
      # static files, so a frontend change goes live in about a minute. Anything else runs the whole suite.
      - name: Pick tests
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scope=full
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            last=$(gh run list -R "$GITHUB_REPOSITORY" -w deploy.yml -b master -e push -s success -L 1 --json headSha -q '.[0].headSha' || true)
            if [ -n "$last" ] && git merge-base --is-ancestor "$last" HEAD 2>/dev/null; then
              changed=$(git diff --name-only "$last" HEAD)
              echo "Changed since the last green deploy ($last):"; echo "$changed"
              if [ -n "$changed" ] && ! grep -qv '^src/claude_proxy/static/' <<<"$changed"; then scope=static; fi
            fi
          fi
          echo "scope=$scope" >>"$GITHUB_OUTPUT"; echo "Test scope: $scope"
      - if: steps.pick.outputs.scope == 'static'
        run: uv run --python 3.12 pytest -q -n auto tests/test_home_host.py tests/test_i18n.py tests/test_web.py tests/test_orders_web.py tests/test_tickets_web.py
      - if: steps.pick.outputs.scope != 'static'
        run: uv run --python 3.12 pytest -q -n auto
      - name: Wait for image
        if: env.DEPLOY == 'true'
        timeout-minutes: 10
        run: |
          until [ -f build.status ]; do sleep 1; done
          cat build.log
          [ "$(cat build.status)" = 0 ] || { echo "image build failed" >&2; exit 1; }
          ls -l payload
      - name: Deploy
        if: env.DEPLOY == 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          (umask 077; printf '%s\n' "$SSH_KEY" >~/.ssh/deploy_key)
          printf '%s\n' "$KNOWN_HOSTS" >~/.ssh/known_hosts
          tar -C payload -cf - image.tar.gz config.toml |
            ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$HOST" "deploy $GITHUB_SHA"
