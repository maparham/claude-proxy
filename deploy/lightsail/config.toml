[listener]
host = "127.0.0.1"
port = 18480
dashboard_host = "127.0.0.1"
dashboard_port = 18481
secure_cookies = true
# Where people reach the two listeners, for sign-up and `claude-gateway on` authorizing in the browser.
public_url = "https://claude.rahkar.pro"
dashboard_url = "https://claude-dash.rahkar.pro"

[db]
path = "/data/claude_proxy.db"

# README "Sign-up and browser authorization". CLERK_SECRET_KEY is in gateway.env.
[signup]
enabled = true
credit_usd = 5.0
free_daily_cap_usd = 20.0   # all accounts still on their credit, together, in any 24 h
clerk_publishable_key = "pk_live_Y2xlcmsuY2xhdWRlLWRhc2gucmFoa2FyLnBybyQ"

# Order emails (docs/superpowers/specs/2026-10-04-order-requests-design.md). support@chartkar.app only forwards to
# maparham40@gmail.com, so mail goes out through that Gmail account (app password "Claude Gateway" as SMTP_PASSWORD in
# gateway.env). The From address is kept only once Gmail has support@chartkar.app as a verified "Send mail as" alias;
# until then Gmail sends it from maparham40@gmail.com.
[email]
smtp_host = "smtp.gmail.com"
smtp_port = 587
smtp_user = "maparham40@gmail.com"
from = "Claude Gateway <support@chartkar.app>"
admin_to = "support@chartkar.app"

# Paid tickets (docs/superpowers/specs/2026-10-03-paid-tickets-design.md). The tiers are written out so the
# capacity sold is visible here: each share_pct is the slice of the subscription one ticket reserves. Changing
# a share changes capacity; existing tickets keep the share they were sold with. default_usd only seeds prices
# on first start; after that they are edited on the dashboard's Pricing tab.
[tickets]
how_to_buy = "Send the amount by bank transfer to the admin and email them with the ticket you want."
max_sold_pct = 80

[tickets.tiers.lite]
label = "Lite"
share_pct = 5
compare = "Claude Pro"
default_usd = { day = 3, week = 8, month = 20 }

[tickets.tiers.standard]
label = "Standard"
share_pct = 25
compare = "Claude Max 5x"
default_usd = { day = 12, week = 35, month = 100 }

[tickets.currencies.EUR]
round_to = 0.50
