retention_days = 365        # requests and quota snapshots older than this are deleted
keep_usage = true           # ... but never: usage is kept for cost analysis

[listener]
host = "127.0.0.1"
port = 18480
dashboard_host = "127.0.0.1"
dashboard_port = 18481
secure_cookies = true
# Where people reach the two listeners, for sign-up and `claude-gateway on` authorizing in the browser.
public_url = "https://claude.rahkar.pro"
dashboard_url = "https://dash.rahkar.pro"
home_url = "https://rahkar.pro"                 # the home page; sign-in links go on to dashboard_url

[db]
path = "/data/claude_proxy.db"

# README "Sign-up and browser authorization". CLERK_SECRET_KEY is in gateway.env.
[signup]
enabled = true
credit_usd = 5.0
free_daily_cap_usd = 20.0   # all accounts still on their credit, together, in any 24 h
clerk_publishable_key = "pk_live_Y2xlcmsuZGFzaC5yYWhrYXIucHJvJA"

# Order emails (docs/superpowers/specs/2026-10-04-order-requests-design.md). support@chartkar.app only forwards to
# maparham40@gmail.com, so mail goes out through that Gmail account (app password "Claude Gateway" as SMTP_PASSWORD in
# gateway.env). The From address is kept only once Gmail has support@chartkar.app as a verified "Send mail as" alias;
# until then Gmail sends it from maparham40@gmail.com.
[email]
smtp_host = "smtp.gmail.com"
smtp_port = 587
smtp_user = "maparham40@gmail.com"
from = "Rahkar AI <support@chartkar.app>"
from_fa = "اشتراک راهکار <support@chartkar.app>"
admin_to = "support@chartkar.app"

# Paid tickets (docs/superpowers/specs/2026-10-03-paid-tickets-design.md). The tiers are written out so the
# capacity sold is visible here: each share_pct is the slice of the subscription one ticket reserves. Changing
# a share changes capacity; existing tickets keep the share they were sold with. default_usd only seeds prices
# on first start; after that they are edited on the dashboard's Pricing tab.
[tickets]
how_to_buy = "Send the amount by bank transfer to the admin and email them with the ticket you want."
how_to_buy_fa = "مبلغ را با انتقال بانکی برای مدیر بفرستید و تیکتی را که می‌خواهید به او ایمیل کنید."
max_sold_pct = 80
# Visitor orders on the home page are off: buyers sign in before ordering, so "Get it" links to the dashboard.
# To bring them back, uncomment (Turnstile widget "Claude Gateway orders"; the secret is TURNSTILE_SECRET in gateway.env).
# turnstile_site_key = "0x4AAAAAAFNrHze8wsEPTc8r"

[tickets.tiers.lite]
label = "Lite"
share_pct = 5
share_5h_pct = 5             # 5-hour share; same as Claude Pro (Max 20x ≈ 20 Pro per 5 hours)
compare = "Claude Pro"
compare_ratio = 6            # Pro plans the shared Max 20x account equals per week
default_usd = { day = 3, week = 8, month = 20 }

[tickets.tiers.standard]
label = "Standard"
share_pct = 25
share_5h_pct = 25            # 5-hour share; same as Claude Max 5x (Max 20x ≈ 4 Max 5x per 5 hours)
compare = "Claude Max 5x"
compare_ratio = 1.7          # Max 5x plans the shared Max 20x account equals per week
default_usd = { day = 12, week = 35, month = 100 }

# The first currency is the one the home page shows.
[tickets.currencies.IRT]   # Toman, for ZarinPal; set the rate on the Pricing tab
round_to = 1000

[tickets.currencies.EUR]
round_to = 0.50

# API keys billed per token against prepaid credit (Claude Code with ANTHROPIC_API_KEY). Present = on.
[api]
max_inflight = 4            # concurrent requests per account (the admin can override per account)
rpm = 60                    # requests per minute per account

# ZarinPal (docs/superpowers/specs/2026-10-05-zarinpal-payments-design.md). Terminal registered for rahkar.pro and
# 3.139.146.5. Off until ZARINPAL_MERCHANT_ID is in gateway.env.
[zarinpal]
sandbox = false
