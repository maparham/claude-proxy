<!doctype html>
<!-- The social preview image (src/claude_proxy/static/og.png), 1200×630. Regenerate after editing:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --user-data-dir="$(mktemp -d)" \
       --hide-scrollbars --window-size=1200,630 --virtual-time-budget=5000 \
       --screenshot=src/claude_proxy/static/og.png docs/og-image.html -->
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=block">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: Vazirmatn, sans-serif; background: #f9f9f7; color: #0b0b0b; position: relative; }
  .frame { position: absolute; inset: 56px 72px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 16px; font-size: 40px; font-weight: 800; letter-spacing: -0.01em; }
  .dot { width: 22px; height: 22px; border-radius: 50%; background: #eb6834; }
  h1 { margin: 64px 0 20px; font-size: 76px; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em; }
  .sub { font-size: 36px; color: #52514e; font-weight: 600; margin: 0; }
  .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; }
  .chips { display: flex; gap: 14px; }
  .chip { font-size: 26px; font-weight: 600; padding: 10px 24px; border-radius: 999px; border: 2px solid rgba(11,11,11,0.12); background: #fcfcfb; }
  .chip.on { background: #0b0b0b; color: #fcfcfb; border-color: #0b0b0b; }
  .term { direction: ltr; font: 600 28px ui-monospace, Menlo, monospace; background: #0b0b0b; color: #fcfcfb; padding: 14px 26px; border-radius: 14px; }
  .term b { color: #eb6834; }
  .url { position: absolute; left: 72px; top: 64px; direction: ltr; font: 600 26px ui-monospace, Menlo, monospace; color: #898781; }
  .bar { position: absolute; right: 0; top: 0; bottom: 0; width: 14px; background: #eb6834; }
</style>
</head>
<body>
<div class="bar"></div>
<div class="url">rahkar.pro</div>
<div class="frame">
  <div class="brand"><span class="dot"></span>کلاد</div>
  <h1>اشتراک کلاد، بدون پرداخت ارزی</h1>
  <p class="sub">بدون احراز هویت · پرداخت ریالی · شروع در چند دقیقه</p>
  <div class="foot">
    <div class="chips"><span class="chip on">بسته روزانه</span><span class="chip">بسته هفتگی</span></div>
    <div class="term"><b>$</b> gclaude</div>
  </div>
</div>
</body>
</html>
